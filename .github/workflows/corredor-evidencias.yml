name: "Corredor: evidencias"

# Capturas (1920, 1440 y 390 px) y video del recorrido de /corredor/ publicado. Resultado en la rama
# "evidencias" (no en main). WebGL por software: sirve para ver la escena, no para medir rendimiento.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o commit a capturar SIN publicarlo (vacío = página publicada)"
        default: ""
      ref_antes:
        description: "Commit ANTES para la comparación (mismos datos y encuadres); vacío = sin comparación"
        default: ""
      url:
        description: "Página publicada a capturar (si ref está vacío)"
        default: "https://jucarfbay.github.io/ecuador-clima-viajes/corredor/"

permissions:
  contents: write

jobs:
  evidencias:
    runs-on: ubuntu-24.04   # Playwright 1.55 aún no instala Chromium en ubuntu-latest (26.04)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/checkout@v4
        if: ${{ inputs.ref_antes != '' }}
        with:
          ref: ${{ inputs.ref_antes }}
          path: antes
      - name: Servir la versión a revisar (con los datos publicados)
        id: sitio
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            mkdir -p site/data
            for f in corredor_lluvia.json estaciones.json pronostico.json vias.json estado.json; do
              curl -fsS "https://jucarfbay.github.io/ecuador-clima-viajes/data/$f" -o "site/data/$f" || echo "sin $f"
            done
            (cd site && nohup python3 -m http.server 8123 > /tmp/http.log 2>&1 &)
            if [ -d antes/site ]; then
              # la versión ANTES lee exactamente los mismos archivos de datos
              mkdir -p antes/site/data && cp site/data/*.json antes/site/data/
              (cd antes/site && nohup python3 -m http.server 8124 > /tmp/http-antes.log 2>&1 &)
              echo "url_antes=http://localhost:8124/corredor/" >> "$GITHUB_OUTPUT"
              mv antes /tmp/antes-src 2>/dev/null || true
            fi
            sleep 2
            echo "url=http://localhost:8123/corredor/" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ inputs.url }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright y Chromium
        run: |
          mkdir -p evidencias /tmp/pw
          cd /tmp/pw
          { npm init -y && npm install --no-audit --no-fund playwright@1.55.0 && npx playwright install --with-deps chromium; } \
            > "$GITHUB_WORKSPACE/evidencias/instalacion.txt" 2>&1 || { tail -50 "$GITHUB_WORKSPACE/evidencias/instalacion.txt"; echo "FALLO_INSTALACION" >> "$GITHUB_WORKSPACE/evidencias/instalacion.txt"; }
          tail -5 "$GITHUB_WORKSPACE/evidencias/instalacion.txt"
      - name: Capturar
        run: |
          cp tools/evidencias_corredor.mjs /tmp/pw/
          node /tmp/pw/evidencias_corredor.mjs "${{ steps.sitio.outputs.url }}" "$GITHUB_WORKSPACE/evidencias" "${{ steps.sitio.outputs.url_antes }}" > evidencias/captura.txt 2>&1 || echo "La captura terminó con error; se publica lo que haya"
          tail -30 evidencias/captura.txt
      - name: Guardar los datos usados (reproducibilidad)
        run: |
          mkdir -p evidencias/datos-usados
          cp site/data/corredor_lluvia.json site/data/estaciones.json evidencias/datos-usados/ 2>/dev/null || true
          cp site/corredor/datos/ruta.json evidencias/datos-usados/ 2>/dev/null || true
          (cd evidencias/datos-usados && sha256sum *.json > SHA256SUMS) || true
      - name: Video a MP4
        run: |
          shopt -s nullglob
          for d in evidencias/video-tmp/*/; do
            n=$(basename "$d"); f=("$d"*.webm)
            [ ${#f[@]} -gt 0 ] || continue
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
            ffmpeg -y -loglevel error -i "${f[0]}" -vf "fps=30" -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p "evidencias/despues-video-$n.mp4" \
              || cp "${f[0]}" "evidencias/despues-video-$n.webm"
          done
          rm -rf evidencias/video-tmp
          ls -la evidencias
      - name: Publicar en la rama evidencias
        run: |
          mv evidencias /tmp/evidencias
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan evidencias-nueva
          git rm -rfq . && git clean -fdxq
          cp -r /tmp/evidencias/* .
          echo "Evidencias de ${{ inputs.ref || inputs.url }} generadas el $(date -u +%FT%TZ) desde ${GITHUB_SHA::7}" > LEEME.txt
          git add -A && git commit -qm "Evidencias del corredor ${GITHUB_SHA::7}"
          git push -f origin evidencias-nueva:evidencias
