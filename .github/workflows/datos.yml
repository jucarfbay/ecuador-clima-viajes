name: Datos y publicación

on:
  schedule:
    - cron: "7 * * * *"   # cada hora (GitHub suele retrasarlo; ver README: disparador externo). El pronóstico solo se recalcula si tiene más de 5,5 h
  workflow_dispatch:
    inputs:
      forzar:
        description: "Recalcular el pronóstico aunque esté vigente"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "config/**", ".github/workflows/datos.yml"]

permissions:
  contents: write   # subir el archivo histórico como versión (release)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pruebas
        run: |
          python -m unittest discover -s tests -v
          node --test tests/logica.test.js

      - name: Respaldo del último pronóstico archivado (por si el sitio no responde)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previo
          for TAG in "archivo-$(date -u +%Y-%m)" "archivo-$(date -u -d '-1 month' +%Y-%m)"; do
            for PRE in pronostico calor; do
              ls previo/${PRE}_*.json.gz >/dev/null 2>&1 && continue
              ULT=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq "[.assets[].name | select(startswith(\"${PRE}_\"))] | sort | last // empty" 2>/dev/null || true)
              if [ -n "$ULT" ]; then gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ULT" -D previo --clobber || true; fi
            done
          done
          ls -la previo

      - name: Descargar y calcular
        env:
          SITIO_PREVIO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: |
          ARGS="--salida site/data --archivo archivo --previo-archivo previo"
          if [ "${{ inputs.forzar }}" = "true" ]; then ARGS="$ARGS --forzar-pronostico"; fi
          python -m pipeline.run $ARGS

      - name: Guardar archivo histórico (versión mensual)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(archivo/*.json.gz)
          if [ ${#files[@]} -eq 0 ]; then echo "Nada que archivar"; exit 0; fi
          TAG="archivo-$(date -u +%Y-%m)"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "Archivo $(date -u +%Y-%m)" \
              --notes "Pronósticos (miembros del ensamble por punto) y lluvia observada de estaciones, para calibrar (Plan 5)."
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Versionar archivos estáticos (evita que el navegador use una versión vieja)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$V\"|; s|src=\"logica.js\"|src=\"logica.js?v=$V\"|; s|href=\"estilos.css\"|href=\"estilos.css?v=$V\"|" site/index.html
          sed -i "s|^const VERSION = \"dev\";|const VERSION = \"$V\";|" site/app.js
          sed -i "s|src=\"corredor.js\"|src=\"corredor.js?v=$V\"|; s|href=\"corredor.css\"|href=\"corredor.css?v=$V\"|" site/corredor/index.html
          grep -q "app.js?v=$V" site/index.html && grep -q "logica.js?v=$V" site/index.html && grep -q "VERSION = \"$V\"" site/app.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
