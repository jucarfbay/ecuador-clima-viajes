name: "Corredor: ruta"

# Geometría vial Latacunga → Ambato → Pelileo → Baños desde OSRM/OpenStreetMap. Se ejecuta a mano y el
# resultado queda versionado (con fuente y fecha) en site/corredor/datos/ruta.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ruta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar OSRM
        run: python tools/ruta_corredor.py site/corredor/datos/ruta.json
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/corredor/datos/ruta.json
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "Corredor: geometría vial desde OSRM/OpenStreetMap"
          git push
